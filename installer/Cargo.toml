[package]
name = "installer"
version = "0.1.0"
edition = "2024"

[dependencies]
litcrypt = "0.4.0"
reqwest = "0.12.23"
tokio = { version = "1", features = ["full", "macros"] }
windows = { version = "0.58.0", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Services"
] }
windows-core = "0.62.0"
winres = "0.1.12"

[build-dependencies]
winres = "0.1.12"


[profile.release]
lto = "thin"
strip = false
codegen-units = 16